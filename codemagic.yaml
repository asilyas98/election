workflows:
  ios-release:
    name: ContractDraft iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - contract
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.simpleai.contract
      vars:
        XCODE_PROJECT: "ContractDraft.xcodeproj"
        XCODE_SCHEME: "ContractDraft"
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true

    scripts:
      - name: Apply signing profiles
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
